# Prints the NAMES of this repository's secrets (never their values), to wire
# the Google Play release to them.
name: Secrets check

on:
  push:
    branches: [claude/affectionate-heisenberg-tmog1v]
    paths: ['.github/workflows/secrets-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secret names
        env:
          ALL: ${{ toJSON(secrets) }}
        run: python3 -c "import json, os; d = json.loads(os.environ['ALL']); print('\n'.join(sorted(k for k in d if k != 'github_token')) or 'none')"
