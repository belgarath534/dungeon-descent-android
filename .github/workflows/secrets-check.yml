# Prints which secrets this repository has (set or missing), never their
# values: to see whether GitHub can sign and upload the Google Play release.
name: Secrets check

on:
  push:
    branches: [claude/affectionate-heisenberg-tmog1v]
    paths: ['.github/workflows/secrets-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Which secrets are set
        env:
          S1: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          S2: ${{ secrets.ANDROID_KEYSTORE }}
          S3: ${{ secrets.KEYSTORE_BASE64 }}
          S4: ${{ secrets.KEYSTORE }}
          S5: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          S6: ${{ secrets.KEYSTORE_PASSWORD }}
          S7: ${{ secrets.ANDROID_KEY_ALIAS }}
          S8: ${{ secrets.KEY_ALIAS }}
          S9: ${{ secrets.ANDROID_KEY_PASSWORD }}
          S10: ${{ secrets.KEY_PASSWORD }}
          S11: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          S12: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS }}
          S13: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          S14: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          S15: ${{ secrets.CERTS_REPO_TOKEN }}
          S16: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          S17: ${{ secrets.CM_KEYSTORE }}
          S18: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          S19: ${{ secrets.CM_KEY_ALIAS }}
          S20: ${{ secrets.CM_KEY_PASSWORD }}
          S21: ${{ secrets.UPLOAD_KEYSTORE }}
          S22: ${{ secrets.SIGNING_KEY }}
        run: |
          names=(x ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE KEYSTORE_BASE64 KEYSTORE ANDROID_KEYSTORE_PASSWORD KEYSTORE_PASSWORD
                 ANDROID_KEY_ALIAS KEY_ALIAS ANDROID_KEY_PASSWORD KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
                 GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS PLAY_SERVICE_ACCOUNT_JSON SERVICE_ACCOUNT_JSON CERTS_REPO_TOKEN
                 FIREBASE_SERVICE_ACCOUNT CM_KEYSTORE CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD UPLOAD_KEYSTORE SIGNING_KEY)
          for i in $(seq 1 22); do v="S$i"; [ -n "${!v}" ] && echo "SET      ${names[$i]}"; done
          echo "(every other name above is missing)"
